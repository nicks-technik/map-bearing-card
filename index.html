<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Assistant Map Bearing Card — Interactive Demo</title>
    <style>
      :root {
        --primary-color: #1e88e5;
        --primary-background-color: #0f172a;
        --secondary-background-color: #1e293b;
        --card-background-color: #1e293b;
        --primary-text-color: #f8fafc;
        --secondary-text-color: #94a3b8;
        --divider-color: rgba(255, 255, 255, 0.1);
        --ha-card-border-radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--primary-background-color);
        color: var(--primary-text-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 24px;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      body.light-theme {
        --primary-color: #0284c7;
        --primary-background-color: #f1f5f9;
        --secondary-background-color: #ffffff;
        --card-background-color: #ffffff;
        --primary-text-color: #0f172a;
        --secondary-text-color: #64748b;
        --divider-color: rgba(0, 0, 0, 0.1);
      }

      header {
        max-width: 1200px;
        margin: 0 auto 24px auto;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-title h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        background: #1e88e5;
        color: white;
        text-transform: uppercase;
      }

      .main-layout {
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 380px;
        gap: 24px;
        align-items: start;
      }

      @media (max-width: 900px) {
        .main-layout {
          grid-template-columns: 1fr;
        }
      }

      .card-preview-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card-shell {
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        overflow: hidden;
        border: 1px solid var(--divider-color);
      }

      .controls-panel {
        background: var(--secondary-background-color);
        border: 1px solid var(--divider-color);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .panel-section-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--primary-color);
        margin-bottom: 8px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .control-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary-text-color);
        display: flex;
        justify-content: space-between;
      }

      .control-label span {
        color: var(--primary-color);
        font-weight: 700;
      }

      input[type='range'] {
        width: 100%;
        accent-color: var(--primary-color);
        cursor: pointer;
      }

      select,
      input[type='text'] {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--divider-color);
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-size: 13px;
        outline: none;
      }

      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        padding: 9px 14px;
        border-radius: 8px;
        border: none;
        background: var(--primary-color);
        color: white;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }

      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      button.btn-secondary {
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        border: 1px solid var(--divider-color);
      }

      button.active {
        background: #10b981;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }

      .checkbox-label input {
        accent-color: var(--primary-color);
        width: 16px;
        height: 16px;
      }

      .yaml-preview {
        background: #090d16;
        color: #93c5fd;
        font-family: monospace;
        font-size: 12px;
        padding: 14px;
        border-radius: 10px;
        overflow-x: auto;
        white-space: pre;
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-title">
        <h1>Home Assistant Map Bearing Card</h1>
        <span class="badge">v1.0.0</span>
      </div>
      <div class="btn-row">
        <button id="toggle-theme-btn" class="btn-secondary">🌙 Toggle Dark/Light Mode</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- Left side: Live Custom Card Display -->
      <div class="card-preview-container">
        <div class="card-shell">
          <map-bearing-card id="card-instance"></map-bearing-card>
        </div>

        <div style="background: var(--secondary-background-color); border: 1px solid var(--divider-color); border-radius: 12px; padding: 16px;">
          <h3 style="font-size: 14px; margin-bottom: 8px; color: var(--primary-color);">Lovelace YAML Configuration</h3>
          <div id="yaml-display" class="yaml-preview"></div>
        </div>
      </div>

      <!-- Right side: Interactive Controls & Simulator -->
      <div class="controls-panel">
        <div>
          <div class="panel-section-title">Bearing & Movement Simulator</div>
          <div class="control-group">
            <div class="control-label">
              <span>Vehicle Bearing / Heading:</span>
              <span id="bearing-val">45° NE</span>
            </div>
            <input type="range" id="bearing-slider" min="0" max="360" step="1" value="45" />
          </div>

          <div style="margin-top: 12px;" class="btn-row">
            <button id="drive-sim-btn">🚗 Start Drive Simulation</button>
            <button id="spin-test-btn" class="btn-secondary">🔄 Test 360° Wrap</button>
          </div>
        </div>

        <div>
          <div class="panel-section-title">Vehicle Model & Styling</div>
          <div class="control-group" style="margin-bottom: 10px;">
            <label class="control-label">Vehicle Silhouette</label>
            <select id="vehicle-type-select">
              <option value="car" selected>Modern Sedan / EV</option>
              <option value="sports_car">Sports Car (GT)</option>
              <option value="suv">SUV / Crossover</option>
              <option value="truck">Truck / Van</option>
              <option value="arrow">Navigation Arrow</option>
              <option value="pointer">Compass Pointer</option>
            </select>
          </div>

          <div class="control-group" style="margin-bottom: 10px;">
            <label class="control-label">Vehicle Color</label>
            <div style="display: flex; gap: 8px; align-items: center;">
              <input type="color" id="vehicle-color-picker" value="#1e88e5" style="border: none; width: 36px; height: 36px; cursor: pointer; background: transparent;" />
              <select id="color-preset-select" style="flex: 1;">
                <option value="#1e88e5" selected>Blue (Tesla / Electric)</option>
                <option value="#ef4444">Torch Red (Sport)</option>
                <option value="#10b981">Emerald Green</option>
                <option value="#f59e0b">Amber Gold</option>
                <option value="#8b5cf6">Ultra Violet</option>
                <option value="#ffffff">Alpine White</option>
                <option value="#1e293b">Midnight Obsidian</option>
              </select>
            </div>
          </div>

          <div class="control-group">
            <div class="control-label">
              <span>Vehicle Size:</span>
              <span id="size-val">46px</span>
            </div>
            <input type="range" id="size-slider" min="28" max="72" step="2" value="46" />
          </div>
        </div>

        <div>
          <div class="panel-section-title">Map Tile Provider</div>
          <select id="map-provider-select">
            <option value="auto" selected>Auto (Theme-Matching)</option>
            <option value="carto_dark">Carto Dark Matter (Dark)</option>
            <option value="carto_light">Carto Positron (Light)</option>
            <option value="osm">OpenStreetMap</option>
            <option value="satellite">Satellite (Esri Imagery)</option>
            <option value="opentopo">OpenTopoMap</option>
          </select>
        </div>

        <div>
          <div class="panel-section-title">Feature Toggles</div>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="checkbox-label">
              <input type="checkbox" id="beam-toggle" checked />
              <span>Directional Beam (Cone of Sight)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="accuracy-toggle" checked />
              <span>GPS Accuracy Radius Circle</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="hud-toggle" checked />
              <span>HUD Overlay (Speed, Compass, State)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="follow-toggle" checked />
              <span>Auto-Follow Vehicle</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="zones-toggle" checked />
              <span>Show Home & Office Zones</span>
            </label>
          </div>
        </div>

        <div>
          <div class="panel-section-title">Speed & Battery</div>
          <div class="control-group" style="margin-bottom: 8px;">
            <div class="control-label">
              <span>Speed:</span>
              <span id="speed-val">58 km/h</span>
            </div>
            <input type="range" id="speed-slider" min="0" max="180" step="1" value="58" />
          </div>
          <div class="control-group">
            <div class="control-label">
              <span>Battery:</span>
              <span id="battery-val">78%</span>
            </div>
            <input type="range" id="battery-slider" min="5" max="100" step="1" value="78" />
          </div>
        </div>
      </div>
    </div>

    <!-- Script loading the custom card -->
    <script type="module" src="/src/index.ts"></script>
    <script type="module">
      import { CARD_TAG } from '/src/const.ts';
      import { getCardinalDirection } from '/src/utils/bearing.ts';

      const card = document.getElementById('card-instance');
      let currentBearing = 45;
      let currentLat = 52.5200;
      let currentLon = 13.4050;
      let currentSpeed = 58;
      let currentBattery = 78;
      let isSimulating = false;
      let simTimer = null;
      let isDark = true;

      // Mock Home Assistant states
      const mockHass = {
        states: {
          'device_tracker.my_car': {
            entity_id: 'device_tracker.my_car',
            state: 'driving',
            attributes: {
              friendly_name: 'Tesla Model Y',
              latitude: currentLat,
              longitude: currentLon,
              bearing: currentBearing,
              speed: currentSpeed,
              unit_of_measurement: 'km/h',
              battery_level: currentBattery,
              gps_accuracy: 14,
            },
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
          'zone.home': {
            entity_id: 'zone.home',
            state: 'zoning',
            attributes: {
              friendly_name: 'Home',
              latitude: 52.5180,
              longitude: 13.4000,
              radius: 120,
            },
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
          'zone.office': {
            entity_id: 'zone.office',
            state: 'zoning',
            attributes: {
              friendly_name: 'Tech Campus',
              latitude: 52.5260,
              longitude: 13.4150,
              radius: 160,
            },
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
        },
        themes: {
          darkMode: isDark,
        },
        language: 'en',
        callService: async (domain, service, data) => {
          console.log('Home Assistant callService:', domain, service, data);
        },
      };

      // Card Config
      let cardConfig = {
        type: `custom:${CARD_TAG}`,
        entity: 'device_tracker.my_car',
        title: 'Cyber Cruiser',
        vehicle_type: 'car',
        vehicle_color: '#1e88e5',
        vehicle_size: 46,
        show_bearing_cone: true,
        show_accuracy: true,
        show_hud: true,
        follow_vehicle: true,
        show_zones: true,
        map_provider: 'auto',
        card_height: '460px',
        default_zoom: 16,
      };

      function updateYamlPreview() {
        const yamlDisplay = document.getElementById('yaml-display');
        yamlDisplay.textContent = `type: custom:map-bearing-card
entity: ${cardConfig.entity}
title: ${cardConfig.title}
vehicle_type: ${cardConfig.vehicle_type}
vehicle_color: "${cardConfig.vehicle_color}"
vehicle_size: ${cardConfig.vehicle_size}
show_bearing_cone: ${cardConfig.show_bearing_cone}
show_accuracy: ${cardConfig.show_accuracy}
map_provider: ${cardConfig.map_provider}
follow_vehicle: ${cardConfig.follow_vehicle}
show_zones: ${cardConfig.show_zones}
show_hud: ${cardConfig.show_hud}`;
      }

      function pushHassUpdate() {
        mockHass.states['device_tracker.my_car'].attributes.latitude = currentLat;
        mockHass.states['device_tracker.my_car'].attributes.longitude = currentLon;
        mockHass.states['device_tracker.my_car'].attributes.bearing = currentBearing;
        mockHass.states['device_tracker.my_car'].attributes.speed = currentSpeed;
        mockHass.states['device_tracker.my_car'].attributes.battery_level = currentBattery;
        mockHass.states['device_tracker.my_car'].state = currentSpeed > 0 ? 'driving' : 'parked';
        mockHass.states['device_tracker.my_car'].last_updated = new Date().toISOString();
        mockHass.themes.darkMode = isDark;

        // Clone hass object reference so Lit triggers update
        card.hass = { ...mockHass };
      }

      function updateConfig(newPartial) {
        cardConfig = { ...cardConfig, ...newPartial };
        card.setConfig(cardConfig);
        updateYamlPreview();
      }

      // Initialize Card
      customElements.whenDefined(CARD_TAG).then(() => {
        card.setConfig(cardConfig);
        pushHassUpdate();
        updateYamlPreview();
      });

      // Controls Binding
      const bearingSlider = document.getElementById('bearing-slider');
      const bearingVal = document.getElementById('bearing-val');
      bearingSlider.addEventListener('input', (e) => {
        currentBearing = Number(e.target.value);
        bearingVal.textContent = `${currentBearing}° ${getCardinalDirection(currentBearing)}`;
        pushHassUpdate();
      });

      const vehicleTypeSelect = document.getElementById('vehicle-type-select');
      vehicleTypeSelect.addEventListener('change', (e) => {
        updateConfig({ vehicle_type: e.target.value });
      });

      const colorPicker = document.getElementById('vehicle-color-picker');
      const colorPresets = document.getElementById('color-preset-select');
      colorPicker.addEventListener('input', (e) => {
        updateConfig({ vehicle_color: e.target.value });
      });
      colorPresets.addEventListener('change', (e) => {
        colorPicker.value = e.target.value;
        updateConfig({ vehicle_color: e.target.value });
      });

      const sizeSlider = document.getElementById('size-slider');
      const sizeVal = document.getElementById('size-val');
      sizeSlider.addEventListener('input', (e) => {
        const val = Number(e.target.value);
        sizeVal.textContent = `${val}px`;
        updateConfig({ vehicle_size: val });
      });

      const mapProviderSelect = document.getElementById('map-provider-select');
      mapProviderSelect.addEventListener('change', (e) => {
        updateConfig({ map_provider: e.target.value });
      });

      document.getElementById('beam-toggle').addEventListener('change', (e) => {
        updateConfig({ show_bearing_cone: e.target.checked });
      });
      document.getElementById('accuracy-toggle').addEventListener('change', (e) => {
        updateConfig({ show_accuracy: e.target.checked });
      });
      document.getElementById('hud-toggle').addEventListener('change', (e) => {
        updateConfig({ show_hud: e.target.checked });
      });
      document.getElementById('follow-toggle').addEventListener('change', (e) => {
        updateConfig({ follow_vehicle: e.target.checked });
      });
      document.getElementById('zones-toggle').addEventListener('change', (e) => {
        updateConfig({ show_zones: e.target.checked });
      });

      const speedSlider = document.getElementById('speed-slider');
      const speedVal = document.getElementById('speed-val');
      speedSlider.addEventListener('input', (e) => {
        currentSpeed = Number(e.target.value);
        speedVal.textContent = `${currentSpeed} km/h`;
        pushHassUpdate();
      });

      const batterySlider = document.getElementById('battery-slider');
      const batteryVal = document.getElementById('battery-val');
      batterySlider.addEventListener('input', (e) => {
        currentBattery = Number(e.target.value);
        batteryVal.textContent = `${currentBattery}%`;
        pushHassUpdate();
      });

      // Dark / Light Theme Toggle
      const toggleThemeBtn = document.getElementById('toggle-theme-btn');
      toggleThemeBtn.addEventListener('click', () => {
        isDark = !isDark;
        document.body.classList.toggle('light-theme', !isDark);
        toggleThemeBtn.textContent = isDark ? '🌙 Toggle Dark/Light Mode' : '☀️ Toggle Dark/Light Mode';
        pushHassUpdate();
      });

      // Drive Simulation
      const driveSimBtn = document.getElementById('drive-sim-btn');
      let simAngle = 0;
      const simRadius = 0.005; // radius in degrees (~550m)
      const centerLat = 52.5200;
      const centerLon = 13.4050;

      driveSimBtn.addEventListener('click', () => {
        isSimulating = !isSimulating;
        driveSimBtn.classList.toggle('active', isSimulating);
        driveSimBtn.textContent = isSimulating ? '⏸ Pause Drive Simulation' : '🚗 Start Drive Simulation';

        if (isSimulating) {
          simTimer = setInterval(() => {
            simAngle = (simAngle + 0.04) % (2 * Math.PI);
            currentLat = centerLat + Math.sin(simAngle) * simRadius;
            currentLon = centerLon + Math.cos(simAngle) * (simRadius * 1.6);
            
            // Bearing is tangent to the circle
            const tangent = (simAngle + Math.PI / 2) * (180 / Math.PI);
            currentBearing = Math.round(((tangent % 360) + 360) % 360);
            
            bearingSlider.value = currentBearing;
            bearingVal.textContent = `${currentBearing}° ${getCardinalDirection(currentBearing)}`;
            currentSpeed = Math.round(55 + Math.sin(simAngle * 3) * 15);
            speedSlider.value = currentSpeed;
            speedVal.textContent = `${currentSpeed} km/h`;

            pushHassUpdate();
          }, 200);
        } else {
          clearInterval(simTimer);
        }
      });

      // 360 Spin Test
      const spinBtn = document.getElementById('spin-test-btn');
      spinBtn.addEventListener('click', () => {
        // Toggle between 355 deg and 10 deg to demonstrate smooth shortest path rotation without backspin
        currentBearing = currentBearing === 355 ? 10 : 355;
        bearingSlider.value = currentBearing;
        bearingVal.textContent = `${currentBearing}° ${getCardinalDirection(currentBearing)}`;
        pushHassUpdate();
      });
    </script>
  </body>
</html>
