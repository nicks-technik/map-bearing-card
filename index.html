<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home Assistant Map Bearing Card — XPENG G6 & EV Demo</title>
    <style>
      :root {
        --primary-color: #ea580c;
        --primary-background-color: #0f172a;
        --secondary-background-color: #1e293b;
        --card-background-color: #1e293b;
        --primary-text-color: #f8fafc;
        --secondary-text-color: #94a3b8;
        --divider-color: rgba(255, 255, 255, 0.1);
        --ha-card-border-radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--primary-background-color);
        color: var(--primary-text-color);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        padding: 24px;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      body.light-theme {
        --primary-color: #ea580c;
        --primary-background-color: #f1f5f9;
        --secondary-background-color: #ffffff;
        --card-background-color: #ffffff;
        --primary-text-color: #0f172a;
        --secondary-text-color: #64748b;
        --divider-color: rgba(0, 0, 0, 0.1);
      }

      header {
        max-width: 1200px;
        margin: 0 auto 24px auto;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 16px;
      }

      .header-title {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .header-title h1 {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .badge {
        font-size: 11px;
        font-weight: 700;
        padding: 4px 8px;
        border-radius: 6px;
        background: #ea580c;
        color: white;
        text-transform: uppercase;
      }

      .main-layout {
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 390px;
        gap: 24px;
        align-items: start;
      }

      @media (max-width: 900px) {
        .main-layout {
          grid-template-columns: 1fr;
        }
      }

      .card-preview-container {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .card-shell {
        border-radius: 16px;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.3);
        overflow: hidden;
        border: 1px solid var(--divider-color);
      }

      .controls-panel {
        background: var(--secondary-background-color);
        border: 1px solid var(--divider-color);
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .panel-section-title {
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--primary-color);
        margin-bottom: 8px;
      }

      .control-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .control-label {
        font-size: 13px;
        font-weight: 600;
        color: var(--primary-text-color);
        display: flex;
        justify-content: space-between;
      }

      .control-label span {
        color: var(--primary-color);
        font-weight: 700;
      }

      input[type='range'] {
        width: 100%;
        accent-color: var(--primary-color);
        cursor: pointer;
      }

      select,
      input[type='text'] {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: 1px solid var(--divider-color);
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        font-size: 13px;
        outline: none;
      }

      .preset-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }

      .preset-chip {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid var(--divider-color);
        color: var(--primary-text-color);
        font-size: 11px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
      }

      .preset-chip:hover {
        background: rgba(255, 255, 255, 0.12);
        transform: translateY(-1px);
      }

      .chip-color {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

      .btn-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        padding: 9px 14px;
        border-radius: 8px;
        border: none;
        background: var(--primary-color);
        color: white;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: opacity 0.2s, transform 0.1s;
      }

      button:hover {
        opacity: 0.9;
        transform: translateY(-1px);
      }

      button.btn-secondary {
        background: var(--primary-background-color);
        color: var(--primary-text-color);
        border: 1px solid var(--divider-color);
      }

      button.active {
        background: #10b981;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
        user-select: none;
      }

      .checkbox-label input {
        accent-color: var(--primary-color);
        width: 16px;
        height: 16px;
      }

      .yaml-preview {
        background: #090d16;
        color: #fdba74;
        font-family: monospace;
        font-size: 12px;
        padding: 14px;
        border-radius: 10px;
        overflow-x: auto;
        white-space: pre;
        border: 1px solid rgba(255, 255, 255, 0.1);
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-title">
        <h1>XPENG G6 Map Bearing Card</h1>
        <span class="badge">v1.1.0</span>
      </div>
      <div class="btn-row">
        <button id="toggle-theme-btn" class="btn-secondary">🌙 Toggle Dark/Light Mode</button>
      </div>
    </header>

    <div class="main-layout">
      <!-- Left side: Live Custom Card Display -->
      <div class="card-preview-container">
        <div class="card-shell">
          <map-bearing-card id="card-instance"></map-bearing-card>
        </div>

        <div style="background: var(--secondary-background-color); border: 1px solid var(--divider-color); border-radius: 12px; padding: 16px;">
          <h3 style="font-size: 14px; margin-bottom: 8px; color: var(--primary-color);">Lovelace YAML Configuration for XPENG</h3>
          <div id="yaml-display" class="yaml-preview"></div>
        </div>
      </div>

      <!-- Right side: Interactive Controls & Simulator -->
      <div class="controls-panel">
        <div>
          <div class="panel-section-title">Bearing & Movement Simulator</div>
          <div class="control-group">
            <div class="control-label">
              <span>Vehicle Bearing / Heading:</span>
              <span id="bearing-val">45° NE</span>
            </div>
            <input type="range" id="bearing-slider" min="0" max="360" step="1" value="45" />
          </div>

          <div style="margin-top: 12px;" class="btn-row">
            <button id="drive-sim-btn">🚗 Start Drive Simulation</button>
            <button id="spin-test-btn" class="btn-secondary">🔄 Test 360° Wrap</button>
          </div>
        </div>

        <div>
          <div class="panel-section-title">XPENG G6 Model & Colors</div>
          <div class="control-group" style="margin-bottom: 10px;">
            <label class="control-label">Vehicle Silhouette</label>
            <select id="vehicle-type-select">
              <option value="xpeng_g6" selected>XPENG G6 Coupe-SUV (Robot Face LED)</option>
              <option value="car">Modern Aerodynamic Sedan / EV</option>
              <option value="sports_car">Sports Car (GT Aero)</option>
              <option value="suv">Standard SUV / Crossover</option>
              <option value="arrow">Navigation Arrow</option>
              <option value="pointer">Compass Pointer</option>
            </select>
          </div>

          <div class="control-group" style="margin-bottom: 10px;">
            <label class="control-label">XPENG Factory Colors</label>
            <div class="preset-chips">
              <button class="preset-chip" data-color="#ea580c"><span class="chip-color" style="background: #ea580c;"></span>Fiery Orange</button>
              <button class="preset-chip" data-color="#f8fafc"><span class="chip-color" style="background: #f8fafc;"></span>Arctic White</button>
              <button class="preset-chip" data-color="#4b5563"><span class="chip-color" style="background: #4b5563;"></span>Graphite</button>
              <button class="preset-chip" data-color="#94a3b8"><span class="chip-color" style="background: #94a3b8;"></span>Silver</button>
              <button class="preset-chip" data-color="#0f172a"><span class="chip-color" style="background: #0f172a;"></span>Obsidian</button>
              <button class="preset-chip" data-color="#059669"><span class="chip-color" style="background: #059669;"></span>Nebula</button>
            </div>
          </div>

          <div class="control-group">
            <div class="control-label">
              <span>Vehicle Size:</span>
              <span id="size-val">48px</span>
            </div>
            <input type="range" id="size-slider" min="32" max="76" step="2" value="48" />
          </div>
        </div>

        <div>
          <div class="panel-section-title">Navigation & Map Modes</div>
          <div class="control-group" style="margin-bottom: 10px;">
            <label class="control-label">Map Tile Provider</label>
            <select id="map-provider-select">
              <option value="auto" selected>Auto (Theme-Matching)</option>
              <option value="carto_dark">Carto Dark Matter (Dark)</option>
              <option value="carto_light">Carto Positron (Light)</option>
              <option value="osm">OpenStreetMap</option>
              <option value="satellite">Satellite (Esri Imagery)</option>
              <option value="opentopo">OpenTopoMap</option>
            </select>
          </div>

          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="checkbox-label">
              <input type="checkbox" id="heads-up-toggle" />
              <span>Heads-Up Mode (Rotate Map with Car)</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="beam-toggle" checked />
              <span>Directional Headlight Beam</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="accuracy-toggle" checked />
              <span>GPS Accuracy Radius Circle</span>
            </label>
            <label class="checkbox-label">
              <input type="checkbox" id="charging-toggle" />
              <span>Simulate Charging (Active Plug)</span>
            </label>
          </div>
        </div>

        <div>
          <div class="panel-section-title">XPENG Telemetry Metrics</div>
          <div class="control-group" style="margin-bottom: 8px;">
            <div class="control-label">
              <span>Speed:</span>
              <span id="speed-val">68 km/h</span>
            </div>
            <input type="range" id="speed-slider" min="0" max="180" step="1" value="68" />
          </div>
          <div class="control-group" style="margin-bottom: 8px;">
            <div class="control-label">
              <span>Battery SOC:</span>
              <span id="battery-val">76%</span>
            </div>
            <input type="range" id="battery-slider" min="5" max="100" step="1" value="76" />
          </div>
          <div class="control-group">
            <div class="control-label">
              <span>Remaining Range:</span>
              <span id="range-val">425 km</span>
            </div>
            <input type="range" id="range-slider" min="30" max="600" step="5" value="425" />
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/src/index.ts"></script>
    <script type="module">
      import { CARD_TAG } from '/src/const.ts';
      import { getCardinalDirection } from '/src/utils/bearing.ts';

      const card = document.getElementById('card-instance');
      let currentBearing = 45;
      let currentLat = 52.5200;
      let currentLon = 13.4050;
      let currentSpeed = 68;
      let currentBattery = 76;
      let currentRange = 425;
      let isCharging = false;
      let isSimulating = false;
      let simTimer = null;
      let isDark = true;

      // Mock Home Assistant states with xpengtoolkit structure
      const mockHass = {
        states: {
          'device_tracker.xpeng_g6_location': {
            entity_id: 'device_tracker.xpeng_g6_location',
            state: 'driving',
            attributes: {
              friendly_name: 'XPENG G6',
              latitude: currentLat,
              longitude: currentLon,
              course: currentBearing,
              bearing: currentBearing,
              speed: currentSpeed,
              coord_valid: true,
              fix_age_s: 15,
              gps_accuracy: 12,
            },
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
          'sensor.xpeng_g6_battery_soc': {
            entity_id: 'sensor.xpeng_g6_battery_soc',
            state: String(currentBattery),
            attributes: { unit_of_measurement: '%' },
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
          'sensor.xpeng_g6_remaining_range': {
            entity_id: 'sensor.xpeng_g6_remaining_range',
            state: String(currentRange),
            attributes: { unit_of_measurement: 'km' },
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
          'binary_sensor.xpeng_g6_charging': {
            entity_id: 'binary_sensor.xpeng_g6_charging',
            state: isCharging ? 'on' : 'off',
            attributes: {},
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
          'zone.home': {
            entity_id: 'zone.home',
            state: 'zoning',
            attributes: {
              friendly_name: 'Home',
              latitude: 52.5180,
              longitude: 13.4000,
              radius: 120,
            },
            last_changed: new Date().toISOString(),
            last_updated: new Date().toISOString(),
          },
        },
        themes: { darkMode: isDark },
        language: 'en',
        callService: async () => {},
      };

      let cardConfig = {
        type: `custom:${CARD_TAG}`,
        entity: 'device_tracker.xpeng_g6_location',
        title: 'XPENG G6',
        vehicle_type: 'xpeng_g6',
        vehicle_color: '#ea580c',
        vehicle_size: 48,
        show_bearing_cone: true,
        show_accuracy: true,
        show_hud: true,
        show_range: true,
        show_charging: true,
        heads_up_mode: false,
        follow_vehicle: true,
        show_zones: true,
        map_provider: 'auto',
        card_height: '460px',
        default_zoom: 16,
      };

      function updateYamlPreview() {
        const yamlDisplay = document.getElementById('yaml-display');
        yamlDisplay.textContent = `type: custom:map-bearing-card
entity: ${cardConfig.entity}
title: ${cardConfig.title}
vehicle_type: ${cardConfig.vehicle_type}
vehicle_color: "${cardConfig.vehicle_color}"
vehicle_size: ${cardConfig.vehicle_size}
heads_up_mode: ${cardConfig.heads_up_mode}
show_bearing_cone: ${cardConfig.show_bearing_cone}
show_accuracy: ${cardConfig.show_accuracy}
show_range: ${cardConfig.show_range}
show_charging: ${cardConfig.show_charging}
map_provider: ${cardConfig.map_provider}`;
      }

      function pushHassUpdate() {
        mockHass.states['device_tracker.xpeng_g6_location'].attributes.latitude = currentLat;
        mockHass.states['device_tracker.xpeng_g6_location'].attributes.longitude = currentLon;
        mockHass.states['device_tracker.xpeng_g6_location'].attributes.course = currentBearing;
        mockHass.states['device_tracker.xpeng_g6_location'].attributes.bearing = currentBearing;
        mockHass.states['device_tracker.xpeng_g6_location'].attributes.speed = currentSpeed;
        mockHass.states['device_tracker.xpeng_g6_location'].state = currentSpeed > 0 ? 'driving' : 'parked';
        mockHass.states['sensor.xpeng_g6_battery_soc'].state = String(currentBattery);
        mockHass.states['sensor.xpeng_g6_remaining_range'].state = String(currentRange);
        mockHass.states['binary_sensor.xpeng_g6_charging'].state = isCharging ? 'on' : 'off';
        mockHass.themes.darkMode = isDark;
        card.hass = { ...mockHass };
      }

      function updateConfig(newPartial) {
        cardConfig = { ...cardConfig, ...newPartial };
        card.setConfig(cardConfig);
        updateYamlPreview();
      }

      customElements.whenDefined(CARD_TAG).then(() => {
        card.setConfig(cardConfig);
        pushHassUpdate();
        updateYamlPreview();
      });

      const bearingSlider = document.getElementById('bearing-slider');
      const bearingVal = document.getElementById('bearing-val');
      bearingSlider.addEventListener('input', (e) => {
        currentBearing = Number(e.target.value);
        bearingVal.textContent = `${currentBearing}° ${getCardinalDirection(currentBearing)}`;
        pushHassUpdate();
      });

      document.querySelectorAll('.preset-chip').forEach((btn) => {
        btn.addEventListener('click', () => {
          updateConfig({ vehicle_color: btn.dataset.color });
        });
      });

      document.getElementById('vehicle-type-select').addEventListener('change', (e) => {
        updateConfig({ vehicle_type: e.target.value });
      });

      document.getElementById('heads-up-toggle').addEventListener('change', (e) => {
        updateConfig({ heads_up_mode: e.target.checked });
      });

      document.getElementById('charging-toggle').addEventListener('change', (e) => {
        isCharging = e.target.checked;
        pushHassUpdate();
      });

      document.getElementById('beam-toggle').addEventListener('change', (e) => {
        updateConfig({ show_bearing_cone: e.target.checked });
      });
      document.getElementById('accuracy-toggle').addEventListener('change', (e) => {
        updateConfig({ show_accuracy: e.target.checked });
      });

      const speedSlider = document.getElementById('speed-slider');
      const speedVal = document.getElementById('speed-val');
      speedSlider.addEventListener('input', (e) => {
        currentSpeed = Number(e.target.value);
        speedVal.textContent = `${currentSpeed} km/h`;
        pushHassUpdate();
      });

      const batterySlider = document.getElementById('battery-slider');
      const batteryVal = document.getElementById('battery-val');
      batterySlider.addEventListener('input', (e) => {
        currentBattery = Number(e.target.value);
        batteryVal.textContent = `${currentBattery}%`;
        pushHassUpdate();
      });

      const rangeSlider = document.getElementById('range-slider');
      const rangeVal = document.getElementById('range-val');
      rangeSlider.addEventListener('input', (e) => {
        currentRange = Number(e.target.value);
        rangeVal.textContent = `${currentRange} km`;
        pushHassUpdate();
      });

      const toggleThemeBtn = document.getElementById('toggle-theme-btn');
      toggleThemeBtn.addEventListener('click', () => {
        isDark = !isDark;
        document.body.classList.toggle('light-theme', !isDark);
        toggleThemeBtn.textContent = isDark ? '🌙 Toggle Dark/Light Mode' : '☀️ Toggle Dark/Light Mode';
        pushHassUpdate();
      });

      // Drive Sim
      const driveSimBtn = document.getElementById('drive-sim-btn');
      let simAngle = 0;
      const simRadius = 0.005;
      const centerLat = 52.5200;
      const centerLon = 13.4050;

      driveSimBtn.addEventListener('click', () => {
        isSimulating = !isSimulating;
        driveSimBtn.classList.toggle('active', isSimulating);
        driveSimBtn.textContent = isSimulating ? '⏸ Pause Drive Simulation' : '🚗 Start Drive Simulation';

        if (isSimulating) {
          simTimer = setInterval(() => {
            simAngle = (simAngle + 0.04) % (2 * Math.PI);
            currentLat = centerLat + Math.sin(simAngle) * simRadius;
            currentLon = centerLon + Math.cos(simAngle) * (simRadius * 1.6);
            const tangent = (simAngle + Math.PI / 2) * (180 / Math.PI);
            currentBearing = Math.round(((tangent % 360) + 360) % 360);
            bearingSlider.value = currentBearing;
            bearingVal.textContent = `${currentBearing}° ${getCardinalDirection(currentBearing)}`;
            currentSpeed = Math.round(65 + Math.sin(simAngle * 3) * 15);
            speedSlider.value = currentSpeed;
            speedVal.textContent = `${currentSpeed} km/h`;
            pushHassUpdate();
          }, 200);
        } else {
          clearInterval(simTimer);
        }
      });

      const spinBtn = document.getElementById('spin-test-btn');
      spinBtn.addEventListener('click', () => {
        currentBearing = currentBearing === 355 ? 10 : 355;
        bearingSlider.value = currentBearing;
        bearingVal.textContent = `${currentBearing}° ${getCardinalDirection(currentBearing)}`;
        pushHassUpdate();
      });
    </script>
  </body>
</html>
